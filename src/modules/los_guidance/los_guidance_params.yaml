module_name: los_guidance
parameters:
- group: LOS Guidance
  definitions:
    LOS_GD_EN:
      description:
        short: Enable LOS-derived OFFBOARD acceleration publisher
        long: |
          When enabled, los_guidance turns body-frame bearing measurements
          (alpha = yaw, beta = pitch) from a gimbal-mounted camera into a
          NED-frame acceleration command and publishes it on
          trajectory_setpoint together with an offboard_control_mode
          heartbeat. The vehicle still has to be switched to OFFBOARD via
          RC/QGC/MAVLink for mc_pos_control to consume the command.
          Disable to silence the internal publisher and hand the OFFBOARD
          slot back to external MAVLink/uXRCE-DDS sources.
      type: boolean
      default: 0

    LOS_GD_ACC_MAX:
      description:
        short: Constant magnitude of the LOS-derived NED acceleration command
        long: |
          The acceleration vector published on trajectory_setpoint has this
          (Euclidean) magnitude, with its direction taken from the
          NED-frame unit vector that points along the camera bearing. Keep
          this safely below MPC_ACC_HOR_MAX / MPC_ACC_DOWN_MAX so the
          position controller does not have to saturate.
      type: float
      default: 5.0
      min: 0.5
      max: 50.0
      unit: m/s^2
      decimal: 2

    LOS_GD_GIMB_PIT:
      description:
        short: Fixed gimbal pitch (camera tilt about body Y axis)
        long: |
          While the gimbal controller is not yet implemented, bearings are
          interpreted as if the camera were held at this constant pitch
          relative to the body frame. Sign convention follows the body Y
          rotation in FRD: positive values rotate the optical axis from
          forward toward down (camera tilted down).
      type: float
      default: 0.0
      min: -1.5708
      max: 1.5708
      unit: rad
      decimal: 3

    LOS_GD_GIMB_YAW:
      description:
        short: Fixed gimbal yaw offset (rotation about body Z between gimbal and body)
        long: |
          Additional rotation about body Z (FRD: positive turns forward toward
          right wing) from the camera/gimbal frame into the body frame.
          Together with LOS_GD_GIMB_PIT this matches Eulerf(roll=0, pitch, yaw)
          in the matrix::Euler convention used by los_guidance. The previous
          hard-coded offset was π/2 radians; default keeps that behavior.
      type: float
      default: 1.5708
      min: -3.14159
      max: 3.14159
      unit: rad
      decimal: 3

    LOS_GD_TIMEOUT:
      description:
        short: LOS sample staleness threshold
        long: |
          If no fresh los_measurements sample has arrived within this
          window, the module stops publishing trajectory_setpoint and the
          offboard_control_mode heartbeat. This lets commander time out
          OFFBOARD and engage the configured failsafe.
      type: int32
      default: 200
      min: 20
      max: 5000
      unit: ms

    LOS_GD_PUB_HZ:
      description:
        short: Internal publish rate for offboard_control_mode + trajectory_setpoint
        long: |
          Must be high enough (>= 25 Hz) to keep the commander OFFBOARD
          heartbeat alive. Applied at module start; runtime changes take
          effect on the next parameter-update tick (the work-item is
          rescheduled).
      type: int32
      default: 50
      min: 10
      max: 250
      unit: Hz

    LOS_GD_YAW_KP:
      description:
        short: Proportional gain on alpha (bearing) -> vehicle yaw rate
        long: |
          PI-controller P term. alpha is +right; output drives
          trajectory_setpoint.yawspeed (+right in FRD). Increase to make
          the airframe yaw harder toward the target, but watch for
          oscillation against the MC_YAWRATE / yawrate-FF tuning.
      type: float
      default: 1.5
      min: 0.0
      max: 10.0
      decimal: 3
      unit: 1/s

    LOS_GD_YAW_KI:
      description:
        short: Integral gain on alpha (bearing) -> vehicle yaw rate
        long: |
          PI-controller I term (units: 1/s^2; PX4 unit whitelist has no
          rad*s/rad^-1 entries so this field is left blank). Removes
          steady-state bearing offset when the target is moving laterally.
          Bounded by LOS_GD_YAW_IM.
      type: float
      default: 0.2
      min: 0.0
      max: 10.0
      decimal: 3

    LOS_GD_YAW_IM:
      description:
        short: Anti-windup clamp on the alpha integrator
        long: |
          Absolute bound on the alpha integral state (physical units:
          rad*s; left unitless because that combination is not on PX4's
          allowed-units whitelist). Combined with conditional integration
          this prevents the I term from dominating after sustained
          saturation of the yaw-rate output.
      type: float
      default: 0.5
      min: 0.0
      max: 5.0
      decimal: 3

    LOS_GD_YR_MAX:
      description:
        short: Maximum |yaw rate| output of the alpha PI controller
        long: |
          Final saturation on trajectory_setpoint.yawspeed. Keep this at
          or below MC_YAWRATE_MAX (and MPC_MAN_Y_MAX for stick scaling)
          so the lower attitude/rate stack does not silently clip the
          setpoint before it reaches the motors.
      type: float
      default: 1.0
      min: 0.05
      max: 6.28
      decimal: 3
      unit: rad/s

    LOS_GD_PIT_KI:
      description:
        short: Integral gain on beta (bearing) -> camera-servo pitch
        long: |
          I-only controller; output is camera pitch in body-Y FRD radians
          (positive = optical axis tilts down). Bounded by LOS_GD_PIT_IM.
          Sign is fixed in code so a positive gain drives the camera to
          follow the target vertically (beta>0 tilts camera up).
      type: float
      default: 1.0
      min: 0.0
      max: 10.0
      decimal: 3
      unit: 1/s

    LOS_GD_PIT_IM:
      description:
        short: Anti-windup clamp on the beta integrator
        long: |
          Absolute bound on the beta integral state (physical units:
          rad*s; unitless here because that combination is not on PX4's
          allowed-units whitelist). Pairs with conditional integration
          when the camera pitch command hits LOS_GD_PIT_MIN / LOS_GD_PIT_MAX.
      type: float
      default: 1.0
      min: 0.0
      max: 5.0
      decimal: 3

    LOS_GD_PIT_MIN:
      description:
        short: Minimum commanded camera pitch (mechanical low stop)
        long: |
          Soft lower limit (rad, FRD body Y, +down) applied to the
          camera-servo command. Set to the most negative angle the
          physical servo + mount can reach.
      type: float
      default: -1.0
      min: -1.5708
      max: 0.0
      decimal: 3
      unit: rad

    LOS_GD_PIT_MAX:
      description:
        short: Maximum commanded camera pitch (mechanical high stop)
        long: |
          Soft upper limit (rad, FRD body Y, +down) applied to the
          camera-servo command. Set to the most positive angle the
          physical servo + mount can reach.
      type: float
      default: 1.0
      min: 0.0
      max: 1.5708
      decimal: 3
      unit: rad

    LOS_GD_PIT_HRG:
      description:
        short: Half-range mapping camera pitch (rad) -> normalized [-1,1]
        long: |
          The gimbal_controls output is normalized: the published
          control[INDEX_PITCH] = (pitch_cmd - LOS_GD_GIMB_PIT) /
          LOS_GD_PIT_HRG, clamped to [-1,1]. Set this to the angular
          excursion that should map to PWM_MAIN_MAX5 vs PWM_MAIN_MIN5.
          REQUIRED PX4 SIDE: set PWM_MAIN_FUNC5 = 421 (Gimbal_Pitch),
          set PWM_MAIN_MIN5 / PWM_MAIN_MAX5 / PWM_MAIN_DIS5 to the
          servo's mechanical range, and set MNT_MODE_OUT = Disabled so
          the gimbal driver does not contend on the gimbal_controls
          topic.
      type: float
      default: 1.0
      min: 0.01
      max: 3.14159
      decimal: 3
      unit: rad
