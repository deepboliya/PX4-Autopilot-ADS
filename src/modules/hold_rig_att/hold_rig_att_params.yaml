module_name: hold_rig_att
parameters:
- group: Hold Rig Att
  definitions:
    HRATT_EN:
      description:
        short: Enable the rig-only 3D attitude ramp-and-hold controller
        long: |
          When enabled, hold_rig_att continuously streams a live
          attitude-tracking setpoint once it has a valid attitude estimate
          (required for commander to admit the OFFBOARD switch at all - no
          position estimate is ever needed, this module never touches
          position). The moment OFFBOARD is engaged it latches the vehicle's
          current yaw, ramps the attitude setpoint to the commanded 3D
          orientation at HRATT_RATE, and then holds it for as long as OFFBOARD
          stays engaged. Leaving OFFBOARD ends the hold and arms a fresh run.
          Publishes nothing while disabled.

          Unlike FRIGAX_EN this defaults to 0, and that is deliberate. This
          module publishes the same two topics as flip_rig_axis,
          flip_rig_pitch_att, flip_rig and flip_rig_pitch
          (offboard_control_mode and vehicle_attitude_setpoint), and
          mc_att_control performs no publisher-identity check whatsoever - it
          accepts whichever setpoint carries the newest timestamp. Two of these
          modules running at once therefore do not "conflict" in any detectable
          way; they silently interleave at loop rate and the vehicle chases the
          average. Enabling this one is an explicit statement that no other
          OFFBOARD publisher is running.
      type: boolean
      default: 0

    HRATT_MODE:
      description:
        short: How the target orientation is specified
        long: |
          Selects which pair of parameters defines the target attitude. Yaw is
          always the yaw latched at OFFBOARD entry in both modes; neither mode
          commands a yaw of its own.

            0 -> TILT + DIRECTION (HRATT_TILT, HRATT_DIR)
            1 -> EULER ROLL + PITCH (HRATT_ROLL, HRATT_PITCH)

          Mode 0 is strongly preferred and is the default. The two modes can
          express the same orientations, but mode 1 loses a degree of freedom
          at large angles and mode 0 never does.

          Why mode 1 degrades: PX4 Euler angles are intrinsic Z-Y-X, so the
          commanded roll is applied first and the commanded pitch second, about
          the ALREADY-ROLLED body axis. Once roll reaches 90 degrees the body y
          axis has rotated onto the world vertical, and pitching about it no
          longer tilts the airframe at all - the body z axis sits at
          [0, -1, 0] for every pitch value:

            (roll 90, pitch  0) -> body_z [0 -1 0], tilt 90 deg
            (roll 90, pitch 15) -> body_z [0 -1 0], tilt 90 deg
            (roll 90, pitch 30) -> body_z [0 -1 0], tilt 90 deg
            (roll 90, pitch 60) -> body_z [0 -1 0], tilt 90 deg

          The pitch command has not been discarded - it has become a rotation
          about the (now horizontal) body z axis. That matters because
          AttitudeControl::update() splits the attitude error into a tilt part
          and a yaw part, gives the tilt part full authority, and scales the
          yaw part by MC_YAW_WEIGHT (0.4 by default) precisely because a
          multicopter has far less torque about body z than about body x or y.
          So a commanded (roll 90, pitch 30) is executed as: 90 degrees of tilt
          at full authority, plus 30 degrees on the weakest axis at 40% weight.
          On the rig that reads as "the roll arrived and the pitch never did".

          Mode 0 avoids all of this by naming the tilt directly: HRATT_TILT is
          the total angle the body z axis moves away from vertical, and
          HRATT_DIR is which way it leans. Neither is degenerate anywhere in
          0-180 degrees.

          Startup diagnostics always print the mode-0 equivalent of a mode-1
          command, including how much of it lands in the yaw channel, so the
          translation can be read straight out of the log.
      type: int32
      default: 0
      min: 0
      max: 1
      values:
        0: Tilt magnitude + direction
        1: Euler roll + pitch

    HRATT_TILT:
      description:
        short: Total tilt angle away from level (HRATT_MODE 0)
        long: |
          Angle between the body z axis and vertical at the held attitude, i.e.
          how far the airframe leans, irrespective of which way. 0 is level.

          This is a true tilt magnitude, so it stays meaningful across the whole
          range - there is no value at which it stops changing the orientation
          or silently trades tilt for yaw, which is exactly what
          HRATT_ROLL/HRATT_PITCH do above about 60 degrees.

          Note what happens to lift authority on the way up. Thrust is a fixed
          passthrough (HRATT_THRUST) with no 1/cos(tilt) compensation on the
          attitude path - the position controller normally does that, and it is
          not in the loop here:

            tilt   0 deg -> 100% of thrust opposes gravity
            tilt  30 deg ->  87%
            tilt  60 deg ->  50%
            tilt  90 deg ->   0%  (body z horizontal, no lift at all)
            tilt 120 deg -> -25%  (inverted: thrust now pushes DOWNWARD)
            tilt 180 deg -> -100%

          Past 90 degrees a negative HRATT_THRUST accelerates the airframe into
          its mount rather than away from it. Only ever run those angles on a
          fixture that physically cannot translate, and reduce the thrust
          magnitude first - the startup check warns about this combination.
      type: float
      default: 0.0
      min: 0.0
      max: 180.0
      unit: deg
      decimal: 0

    HRATT_DIR:
      description:
        short: Direction the airframe leans (HRATT_MODE 0)
        long: |
          Direction of the rotation axis about which HRATT_TILT is applied,
          measured in the body xy-plane from the body x (roll) axis toward the
          body y (pitch) axis. This is the same convention as FRIGAX_AXIS, so a
          given HRATT_TILT/HRATT_DIR pair parks the airframe at exactly the
          attitude a flip_rig_axis run with FRIGAX_AXIS=HRATT_DIR and
          FRIGAX_HOLD_ANG=HRATT_TILT would stop at.

            0 deg   -> tilt about body x: pure roll, right wing down
            90 deg  -> tilt about body y: pure pitch, nose down
            180 deg -> pure roll the other way
            270 deg -> pure pitch the other way, nose up
            45 deg  -> diagonal, an equal mix of roll and pitch

          The direction is applied in the body frame of the latched yaw, so it
          is relative to where the nose is pointing, not to north.

          Torque authority is not the same in every direction, and it matters
          more for the RAMP than for the hold. On a quadrotor in X
          configuration the 45/135/225/315 degree axes point straight along a
          motor arm: the two rotors on that axis have no moment arm about it, so
          only two rotors do the work and the mixer clips at 1/sqrt(2) (about
          71%) of what a pure roll or pure pitch gets. Pure roll and pure pitch
          are the best cases because those axes pass between the arms and all
          four rotors contribute. When holding a diagonal attitude, lower
          HRATT_RATE by roughly 30% and consider MC_AIRMODE >= 1 so the mixer
          preserves roll/pitch authority instead of stealing collective thrust
          when it saturates.
      type: float
      default: 0.0
      min: 0.0
      max: 360.0
      unit: deg
      decimal: 0

    HRATT_ROLL:
      description:
        short: Commanded Euler roll (HRATT_MODE 1 only)
        long: |
          Body roll of the held attitude, in PX4's intrinsic Z-Y-X Euler
          convention: yaw is applied first (the latched yaw), then HRATT_PITCH,
          then this. Ignored unless HRATT_MODE is 1.

          Read the HRATT_MODE notes before using this. Beyond about 60 degrees
          the roll/pitch pair stops behaving the way the numbers suggest,
          because the pitch command is applied about the already-rolled axis. At
          exactly 90 degrees of roll, HRATT_PITCH has no effect on tilt at all.

          A second, purely cosmetic consequence: Euler extraction is not
          injective, so the roll/pitch read back from the attitude estimate will
          not always match what was commanded even when the orientation is
          exactly right. Commanded (roll 45, pitch 90) reads back as
          (roll 26.6, pitch 90); commanded (roll 180, pitch 180) reads back as
          (roll 0, pitch 0, yaw 180) - the same orientation, a different triple.
          For that reason `hold_rig_att status` reports the target quaternion
          and the tilt magnitude rather than an Euler readback.
      type: float
      default: 0.0
      min: -180.0
      max: 180.0
      unit: deg
      decimal: 0

    HRATT_PITCH:
      description:
        short: Commanded Euler pitch (HRATT_MODE 1 only)
        long: |
          Body pitch of the held attitude, in PX4's intrinsic Z-Y-X Euler
          convention - applied after the latched yaw and before HRATT_ROLL,
          about the body y axis as it stands after the yaw rotation. Ignored
          unless HRATT_MODE is 1.

          See HRATT_MODE and HRATT_ROLL. This parameter is the one that goes
          quietly ineffective at large HRATT_ROLL: with roll at 90 degrees the
          body y axis is vertical, so pitching about it rotates the airframe
          about its own (horizontal) z axis instead of tilting it. The rotation
          still happens, but the attitude controller routes it into the
          deprioritized yaw channel where it is scaled by MC_YAW_WEIGHT and
          executed on the axis with the least torque available.

          Startup diagnostics report exactly how many degrees of a given
          command end up in that channel.
      type: float
      default: 0.0
      min: -180.0
      max: 180.0
      unit: deg
      decimal: 0

    HRATT_RATE:
      description:
        short: Slew rate of the attitude setpoint on its way to the target
        long: |
          Angular speed at which the internal "leader" attitude setpoint travels
          from the vehicle's live attitude to the commanded target, along the
          shortest arc between them. Once it arrives, the leader stops and the
          target is republished unchanged for the rest of the hold.

          Ramping instead of stepping is the entire reason this module exists
          rather than a one-line static setpoint publisher, so it is worth being
          precise about what a step would do. AttitudeControl::update() turns
          attitude error into a rate demand through

              rate_sp = 2 * sin(Phi/2) * MC_ROLL_P

          where Phi is the total angle error. That output is then hard-clamped
          at MC_ROLLRATE_MAX. With the defaults (MC_ROLL_P 4.0,
          MC_ROLLRATE_MAX 220 deg/s) the clamp is reached at only Phi = 57
          degrees, and a static command of roll 90 / pitch 30 presents
          Phi = 94 degrees at once, demanding 335 deg/s - about 1.5 times the
          clamp. The result is a full-authority slam into the target, and with
          MC_AIRMODE=0 the allocator pays for the saturated roll/pitch torque by
          cutting collective thrust, which shows up on hardware as a thrust jerk
          that HRATT_THRUST never asked for.

          The ramp replaces that single large error with a small steady tracking
          lag of roughly

              lag = HRATT_RATE / MC_ROLL_P

          (about 11 degrees at the 45 deg/s default), which never saturates
          anything. Keep the rate low enough that the lag stays modest: the
          startup check warns above roughly 30 degrees of lag, and also warns if
          the rate approaches either MC_ROLLRATE_MAX/MC_PITCHRATE_MAX or the
          structural 2*MC_ROLL_P / 2*MC_PITCH_P ceiling of the P-law itself.

          The default is deliberately well below FRIGAX_RATE's 120 deg/s. A flip
          wants to be quick because it is transient; a hold has nowhere to be,
          and a slow approach is strictly safer on a rig.
      type: float
      default: 45.0
      min: 5.0
      max: 120.0
      unit: deg/s
      decimal: 0

    HRATT_THRUST:
      description:
        short: Normalized body-Z thrust held throughout
        long: |
          Passed straight through as thrust_body[2] during tracking, the ramp
          and the hold (negative = upward in PX4's body frame).

          Left at its default of 0, the module instead reads MPC_THR_HOVER
          every cycle (sign-flipped) and uses that as the base thrust. This is
          deliberately the same number mc_pos_control already uses and that
          this module's docs used to tell you to go copy in by hand - there is
          no reason to keep two independently-tunable copies of "this
          vehicle's hover thrust" in sync. Set HRATT_THRUST to a nonzero value
          only to override that: for example, -0.5 is the value at which the
          mixer has the most symmetric motor headroom, min(u0, 1-u0), which is
          rarely the same number as this vehicle's actual hover thrust and is
          why HRATT_THRUST_K exists rather than just chasing -0.5 here.
          Moving away from whichever base is in effect costs authority in one
          direction to buy it in the other, and with MC_AIRMODE=0 the
          allocator's first response to a saturating torque demand is to
          reduce collective thrust regardless.

          This is the value used at zero tilt; see HRATT_THRUST_K for how it
          scales as the commanded tilt grows. Whichever base is in effect is
          still held constant no matter how far over the airframe is leaning
          past 90 degrees of tilt - it then drives the airframe downward into
          its mount, compensation or not - see HRATT_TILT. Reduce the
          magnitude before running those angles.
      type: float
      default: 0.0
      min: -1.0
      max: 0.0
      decimal: 2

    HRATT_THRUST_K:
      description:
        short: Thrust boost gain as commanded tilt increases
        long: |
          hold_rig_att's own logs showed the same motor pinned at its floor for
          the entire hold on several large-tilt targets, unchanged across a
          4x MC_ROLL_P increase and moving HRATT_THRUST to the mixer's
          symmetric-headroom optimum of -0.5. Neither moved the residual error,
          because for a STATIC target the roll/pitch differential the
          allocator must apply is one-sided for the whole hold - it always
          drives the same motor toward 0 - so the fix is not a faster
          correction (MC_ROLL_P) or a differently-balanced default (-0.5), it
          is more headroom on the specific side already being consumed. That
          means a larger |HRATT_THRUST|, and it should grow with tilt: more of
          the commanded attitude is differential rather than pure collective
          the further over the airframe leans.

          The published thrust becomes:

              thrust_body[2] = HRATT_THRUST * (1 + HRATT_THRUST_K * sin(tilt))

          using the LEADER's current tilt (tilt_of() in AttitudeRampMath.hpp),
          not the final target's - so the boost phases in smoothly alongside
          the ramp and is already at its full value by the time the leader
          parks, rather than stepping the whole way at once.

          Default 0 reproduces the old constant-thrust behaviour exactly. This
          will not help a residual error that repeats identically regardless
          of tuning (see HRATT_RATE's docs on that failure mode) - that is a
          mechanical limit on the rig, not a torque budget, and no thrust
          schedule fixes it. It is aimed at the other kind of failure: a
          target within reach whose margin is thin enough that it saturates
          unpredictably run to run.

          There is no first-principles value for this gain - unlike
          HRATT_THRUST there is no hover weight to support here, only motor
          headroom to buy back, so pick it empirically from a log showing
          which motor saturates and by how much. check_thrust_against_tilt()
          warns if the resulting thrust magnitude exceeds 1.0 at the current
          target's tilt, which is the mixer's own ceiling regardless of what
          is asked for.
      type: float
      default: 0.0
      min: 0.0
      max: 2.0
      decimal: 2

    HRATT_RAMP_T:
      description:
        short: Safety cutoff for the ramp phase
        long: |
          Maximum time the ramp is allowed to run before the module stops
          advancing the leader and holds wherever it reached.

          This should exceed (total angle to travel) / HRATT_RATE, and the
          startup check warns when it does not. Unlike the equivalent
          FRIGAX_DURATION check on a full revolution, falling short here is
          benign: the hold that follows parks at the attitude the leader
          actually reached rather than snapping anywhere, so an early cutoff
          costs accuracy and nothing else. It exists to bound the ramp if a
          parameter combination or a stalled clock would otherwise let it run
          indefinitely.
      type: float
      default: 10.0
      min: 1.0
      max: 30.0
      unit: s
      decimal: 1

    HRATT_PUB_HZ:
      description:
        short: Internal publish rate for offboard_control_mode + setpoints
        long: |
          Must be high enough (>= 25 Hz) to keep the commander OFFBOARD
          heartbeat alive, and also sets the integration step for the ramp - too
          low a rate coarsens each step of the leader's advance. Applied at
          module start; runtime changes take effect on the next parameter-update
          tick (the work-item is rescheduled).
      type: int32
      default: 100
      min: 25
      max: 250
      unit: Hz

    HRATT_LIVE:
      description:
        short: Allow retargeting while the attitude is being held
        long: |
          When 0 (the default) the target is latched at OFFBOARD entry and
          parameter changes made during the run are ignored until OFFBOARD is
          left and re-entered. This matches flip_rig_axis, and the reasoning is
          the same: moving the target from under a manoeuvre already in progress
          is rarely what the operator meant.

          When 1 the target is re-evaluated every cycle, and changing
          HRATT_TILT/HRATT_DIR (or HRATT_ROLL/HRATT_PITCH) mid-hold re-engages
          the ramp toward the new attitude at HRATT_RATE. This is safe because
          the ramp is convergent rather than open-loop - it recomputes the
          shortest arc from wherever the leader currently is to wherever the
          target currently is, so a target that moves mid-ramp is simply chased,
          never overshot or lost.

          Useful for sweeping a rig through a series of attitudes without
          cycling OFFBOARD between each one. The retarget is rate-limited by
          HRATT_RATE exactly like the initial ramp, so a large jump in the
          parameters cannot produce a step command.
      type: boolean
      default: 0

    HRATT_ARM_GATE:
      description:
        short: Wait out the post-arm lockdown window before ramping
        long: |
          When 1 (the default) the ramp does not begin until the vehicle has
          been armed for longer than COM_LKDOWN_TKO + COM_SPOOLUP_TIME, holding
          the attitude-tracking setpoint in the meantime. This exists to dodge a
          specific and unpleasant failsafe interaction.

          The attitude failure detector compares Euler roll and pitch against
          FD_FAIL_R / FD_FAIL_P (both 60 degrees by default) with a 0.3 s
          trigger time, and it is armed whenever attitude control is enabled -
          which is precisely the condition this module needs. Any hold past 60
          degrees therefore trips it. What the trip does depends on when it
          happens:

            - Later than COM_LKDOWN_TKO + COM_SPOOLUP_TIME after arming, with
              CBRK_FLIGHTTERM at its 121212 default, the action is only a
              warning.
            - Earlier than that, the action is an unconditional DISARM, and it
              is marked cannotBeDeferred() in failsafe.cpp - no circuit breaker,
              parameter or mode-executor deferral suppresses it.

          So arming and immediately tilting past 60 degrees hard-disarms the
          vehicle about 0.3 s later. On a rig that is a drop, not a warning.

          Setting FD_FAIL_R and FD_FAIL_P to 0 disables the check outright and
          is the right configuration for rig work; this gate is the belt to that
          braces, and costs nothing when the parameters are already correct.
          Set to 0 only if the timing is being handled by other means.
      type: boolean
      default: 1
